# Verda API credentials for the manager, following the upstream
# Cluster API provider pattern (config/manager/credentials.yaml in
# the Cluster API book's provider walkthrough).
#
# The values are placeholders, not credentials: whoever renders the
# components substitutes them from the environment —
#   * clusterctl substitutes ${...} variables at init time,
#   * the Cluster API Tiltfile passes tilt-settings.yaml's
#     kustomize_substitutions map to its prepare step as env vars,
#   * by hand: kustomize build config/default | envsubst
# Never commit real values here. If the placeholders reach a cluster
# unsubstituted, the manager starts (both values are non-empty) but
# every Verda API call fails authentication.
apiVersion: v1
kind: Secret
metadata:
  name: verda-api-creds
  namespace: system
type: Opaque
stringData:
  VERDA_CLIENT_ID: ${VERDA_CLIENT_ID}
  VERDA_CLIENT_SECRET: ${VERDA_CLIENT_SECRET}
