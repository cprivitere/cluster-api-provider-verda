---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: verdamachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: VerdaMachine
    listKind: VerdaMachineList
    plural: verdamachines
    singular: verdamachine
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VerdaMachine is the Schema for the verdamachines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VerdaMachine
            properties:
              image:
                description: image is the Verda image name, e.g. 26.04.cuda13.4.
                type: string
              instanceType:
                description: instanceType is the Verda instance type, e.g. CPU.4V.16G.
                type: string
              isSpot:
                description: |-
                  isSpot requests a spot instance. Spot instances can be
                  discontinued by Verda; the reconciler surfaces that on the
                  status instead of silently recreating the machine.
                type: boolean
              location:
                description: |-
                  location is the Verda location code. Empty means the SDK's
                  default location.
                type: string
              networkID:
                description: |-
                  networkID and subnetID explicitly attach a worker instance to
                  a private network and one of its subnets. They must be set
                  together or not at all. Workers are created unattached unless
                  these are set — an unattached worker reaches the API server
                  through the cluster's public endpoint. Control-plane machines
                  ignore these fields: they always join their cluster's network,
                  because the endpoint proxy forwards to the control plane's
                  pinned private address.
                type: string
              providerID:
                description: |-
                  providerID is the Verda instance this machine manages, in the
                  form verda://<location>/<instance-id>. The controller sets it
                  once the instance exists; on later passes it is the identity
                  the reconciler trusts. A plain string, per the Cluster API
                  v1beta2 contract guidance for infrastructure machines.
                type: string
              sshKeyIDs:
                description: |-
                  sshKeyIDs are the UUIDs of SSH keys registered in the Verda
                  project that should be granted login on the instance.
                items:
                  type: string
                type: array
              subnetID:
                description: |-
                  subnetID is the subnet within networkID to take the worker's
                  private address from. See networkID.
                type: string
            required:
            - image
            - instanceType
            type: object
          status:
            description: status defines the observed state of VerdaMachine
            properties:
              addresses:
                description: addresses are the instance's network addresses.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the VerdaMachine resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureMessage:
                description: |-
                  failureMessage is set when the instance reaches a state the
                  operator should know about — currently a spot instance being
                  discontinued. It is the human-readable companion to the Ready
                  condition; the condition is the contract-visible signal.
                type: string
              initialization:
                description: |-
                  initialization carries the Cluster API v1beta2 contract's
                  provisioning signal: provisioned flips true once the instance
                  exists, and core surfaces the providerID and addresses onto
                  the Machine at the same moment.
                properties:
                  provisioned:
                    description: provisioned reports whether the infrastructure is
                      provisioned.
                    type: boolean
                type: object
              interruptible:
                description: |-
                  interruptible reports whether the backing instance can be
                  interrupted (a spot instance). Core reflects it onto the
                  Node as the cluster.x-k8s.io/interruptible label.
                type: boolean
              ready:
                description: |-
                  ready reports whether the instance exists and is running.
                  Kept as a human convenience; the contract signal is
                  initialization.provisioned.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
