# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/infrastructure.cluster.x-k8s.io_verdaclusters.yaml
- bases/infrastructure.cluster.x-k8s.io_verdamachines.yaml
- bases/infrastructure.cluster.x-k8s.io_verdaclustertemplates.yaml
- bases/infrastructure.cluster.x-k8s.io_verdamachinetemplates.yaml
# +kubebuilder:scaffold:crdkustomizeresource

# Cluster API contract version labels (required by the provider
# contract, https://cluster-api.sigs.k8s.io/developer/providers/contracts/overview.html#api-version-labels):
# core resolves ContractVersionedObjectReference apiGroups by reading
# these labels off the CRDs; the value lists the API versions of this
# provider that satisfy the named contract. kubebuilder does not
# scaffold them. This provider serves only v1alpha1, which implements
# both the v1beta1 and v1beta2 contracts.
labels:
- pairs:
    cluster.x-k8s.io/v1beta1: v1alpha1
    cluster.x-k8s.io/v1beta2: v1alpha1

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# [WEBHOOK] To enable webhook, uncomment the following section
# the following config is for teaching kustomize how to do kustomization for CRDs.
#configurations:
#- kustomizeconfig.yaml
